<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant</title>
    <meta name="description" content="A minimal, interactive AI Knowledge Assistant.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <div class="chat-layout">
            <!-- Header Title -->
            <header class="app-header">
                <h1 class="app-title">AI Knowledge Assistant</h1>
            </header>

            <!-- Scrollable Chat Window -->
            <main id="chat-window" class="chat-window">
                <!-- Message bubbles appended here -->
            </main>

            <!-- Fixed Footer with Suggested Prompts & Input Bar -->
            <footer class="chat-footer">
                <div class="suggested-chips-row" id="suggested-chips-row">
                    <button class="prompt-chip" data-query="What is Artificial Intelligence?">What is Artificial Intelligence?</button>
                    <button class="prompt-chip" data-query="Explain BFS and DFS">Explain BFS and DFS</button>
                    <button class="prompt-chip" data-query="What is a heuristic function?">What is a heuristic function?</button>
                    <button class="prompt-chip" data-query="Explain the Minimax algorithm">Explain the Minimax algorithm</button>
                    <button class="prompt-chip" data-query="What is First-Order Logic?">What is First-Order Logic?</button>
                    <button class="prompt-chip" data-query="What is an expert system?">What is an expert system?</button>
                </div>

                <form id="chat-form" class="chat-input-bar">
                    <input type="text" id="chat-input" placeholder="Ask anything..." autocomplete="off" aria-label="Ask anything">
                    <button type="submit" id="chat-send-btn" aria-label="Send message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <!-- Application JavaScript Modules -->
    <script src="js/rules.js"></script>
    <script src="js/responses.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
